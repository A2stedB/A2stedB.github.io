<svg viewBox="0 0 1000 600" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 霓虹发光滤镜 -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur1" />
      <feGaussianBlur stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- 轻微发光滤镜 -->
    <filter id="lightGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 深色背景 (仅作预览衬托，如不需要可删除此 rect) -->
  <!-- <rect width="100%" height="100%" fill="#02060d" /> -->

  <!-- ================= 内层边框 (Inner Border) ================= -->
  <!-- 细线，带有四角倒角 -->
  <path d="
      M 200,130 
      L 800,130 
      L 810,140 
      L 810,460 
      L 800,470 
      L 200,470 
      L 190,460 
      L 190,140 
      Z" 
    fill="none" 
    stroke="#1b5a8f" 
    stroke-width="1.5" 
    opacity="0.8" />

  <!-- ================= 外层边框 (Outer Border) ================= -->
  <!-- 包含中心凹槽和倒角的连续边框 -->
  <path d="
      M 195,120 
      L 490,120 L 495,125 L 505,125 L 510,120 L 805,120 
      L 820,135 
      L 820,290 L 815,295 L 815,305 L 820,310 L 820,465 
      L 805,480 
      L 510,480 L 505,475 L 495,475 L 490,480 L 195,480 
      L 180,465 
      L 180,310 L 185,305 L 185,295 L 180,290 L 180,135 
      Z" 
    fill="none" 
    stroke="#3c9ee5" 
    stroke-width="1.5" 
    filter="url(#lightGlow)" />

  <!-- ================= 边角加粗修饰 (Corner Accents) ================= -->
  <!-- 悬浮在外层边框外的加粗科技感括号 -->
  <g fill="none" stroke="#8ce5ff" stroke-width="3.5" filter="url(#neonGlow)">
    <!-- 左上角 -->
    <path d="M 175,160 L 175,130 L 195,110 L 230,110" />
    <!-- 右上角 -->
    <path d="M 770,110 L 805,110 L 825,130 L 825,160" />
    <!-- 右下角 -->
    <path d="M 825,440 L 825,470 L 805,490 L 770,490" />
    <!-- 左下角 -->
    <path d="M 230,490 L 195,490 L 175,470 L 175,440" />
  </g>

  <!-- ================= 边缘 UI 细节 (UI Tech Details) ================= -->
  <!-- 左右两侧中心的向内小三角 -->
  <polygon points="175,295 175,305 180,300" fill="#8ce5ff" filter="url(#lightGlow)" />
  <polygon points="825,295 825,305 820,300" fill="#8ce5ff" filter="url(#lightGlow)" />

  <!-- 四角的微小数据节点方块 -->
  <rect x="183" y="140" width="3" height="3" fill="#3c9ee5" />
  <rect x="814" y="140" width="3" height="3" fill="#3c9ee5" />
  <rect x="814" y="457" width="3" height="3" fill="#3c9ee5" />
  <rect x="183" y="457" width="3" height="3" fill="#3c9ee5" />

  <!-- 右下角模拟数据读取条 -->
  <g fill="none" stroke="#3c9ee5" stroke-width="1.5" opacity="0.6">
    <line x1="835" y1="475" x2="850" y2="475" />
    <line x1="835" y1="480" x2="865" y2="480" />
    <line x1="835" y1="485" x2="845" y2="485" />
  </g>
  
  <!-- 左上角模拟数据读取条 -->
  <g fill="none" stroke="#3c9ee5" stroke-width="1.5" opacity="0.6">
    <line x1="150" y1="120" x2="165" y2="120" />
    <line x1="135" y1="125" x2="165" y2="125" />
  </g>
</svg>
